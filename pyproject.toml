[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-youxuan"
version = "1.0.0"
description = "Cloudflare IP latency and download-speed selector"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CF优选 contributors"}]
dependencies = [
  "customtkinter>=5.2",
  "Pillow>=10.0",
]

[project.optional-dependencies]
cli = ["tqdm>=4.66"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]
build = ["pyinstaller>=6.0"]
all = [
  "tqdm>=4.66",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pyinstaller>=6.0",
]

[project.scripts]
cf-youxuan = "update:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["update", "gui", "gui_redesign", "models", "config", "input_sources", "latency", "speed_test", "exporters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-W error"


